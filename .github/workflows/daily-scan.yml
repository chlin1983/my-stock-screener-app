name: Daily Stock Screener Scan

on:
  schedule:
    # Runs at 22:00 UTC (6:00 PM EST / 3:00 PM PST) every weekday (Monday through Friday)
    # Adjust this based on your preferred time
    - cron: '0 22 * * 1-5'
  
  # This allows you to manually trigger the scan anytime from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe to scan'
        required: true
        type: choice
        options:
          - 'Custom Watchlist'
          - 'All Index (Dow Jones 30 + Nasdaq 100 + S&P 500)'
          - 'Full NASDAQ Exchange'
          - 'Full NYSE Exchange'
          - 'AMEX Exchange'
          - 'Run All Sequences Automatically'
        default: 'All Index (Dow Jones 30 + Nasdaq 100 + S&P 500)'

jobs:
  run-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent runs
          
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # You need to add this JSON key in your GitHub Repository settings
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          
      - name: Run Daily Scan
        env:
          STORAGE_TYPE: 'gcs'
          # Add these to your GitHub Repository Secrets
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd backend
          
          # If triggered manually, use the provided input. Otherwise scan all universes sequentially
          UNIVERSE="${{ github.event.inputs.universe }}"
          if [ -z "$UNIVERSE" ] || [ "$UNIVERSE" == "Run All Sequences Automatically" ]; then
            UNIVERSES="watchlist all_index nasdaq nyse amex"
            for u in $UNIVERSES; do
              echo "============================================="
              echo "Starting scan for universe: $u"
              echo "============================================="
              python scanner_job.py "$u"
            done
          else
            case "$UNIVERSE" in
              "Custom Watchlist") TARGET="watchlist" ;;
              "All Index (Dow Jones 30 + Nasdaq 100 + S&P 500)") TARGET="all_index" ;;
              "Full NASDAQ Exchange") TARGET="nasdaq" ;;
              "Full NYSE Exchange") TARGET="nyse" ;;
              "AMEX Exchange") TARGET="amex" ;;
              *) TARGET="$UNIVERSE" ;;
            esac
            echo "Starting scan for universe: $UNIVERSE ($TARGET)"
            python scanner_job.py "$TARGET"
          fi
